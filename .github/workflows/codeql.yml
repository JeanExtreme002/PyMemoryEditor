name: CodeQL

# Static analysis of the Python sources (the library, the MCP server and the
# app). Findings land in the repository's Security tab as code-scanning
# alerts. This is the advanced-setup workflow: the repository's CodeQL
# "default setup" must stay off, since GitHub refuses to run both.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so new queries shipped with a CodeQL release reach code that has
  # not changed. Offset from python-package.yml's midnight run.
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # upload the SARIF results to code scanning
      actions: read  # read the workflow run's metadata for the upload
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
      with:
        languages: python
        # Python needs no build. `security-extended` widens the default suite
        # with lower-precision security queries but leaves out the
        # maintainability ones, which flake8 and mypy already cover here.
        build-mode: none
        queries: security-extended

    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
      with:
        category: /language:python
