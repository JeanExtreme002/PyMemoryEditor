name: Publish to PyPI and the MCP Registry

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing (OIDC)
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'

    - name: Install build tools
      run: python -m pip install --upgrade pip build twine

    - name: Check the release tag matches the package version
      # The tag is the one thing a human typed by hand. server.json is checked
      # against the package by tests/mcp_server/test_registry.py and against
      # the tag by the mcp-registry job below; this closes the last side of
      # the triangle before anything is uploaded (PyPI uploads are
      # irrevocable).
      run: |
        version=$(python -c "import PyMemoryEditor; print(PyMemoryEditor.__version__)")
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::release $GITHUB_REF_NAME but PyMemoryEditor.__version__ is $version"
          exit 1
        fi

    - name: Build package
      run: python -m build

    - name: Check the distributions
      run: python -m twine check --strict dist/*

    - name: Publish to PyPI
      # Pinned to a release tag's commit rather than the moving `release/v1`
      # ref; Dependabot bumps the SHA and the tag comment together.
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  # The MCP Registry checks the package on PyPI (the README's mcp-name marker,
  # the pinned version), so this runs only once the upload above succeeded.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # mcp-publisher logs in with the workflow's OIDC token
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Check the release matches server.json
      run: |
        listed=$(jq -r .version server.json)
        if [ "v$listed" != "$GITHUB_REF_NAME" ]; then
          echo "::error::release $GITHUB_REF_NAME but server.json lists $listed"
          exit 1
        fi
        echo "VERSION=$listed" >> "$GITHUB_ENV"

    - name: Wait for PyPI to serve the release
      run: |
        # PyPI's JSON API can lag the upload by a few minutes.
        for _ in $(seq 1 30); do
          if curl -fsS "https://pypi.org/pypi/pymemoryeditor/$VERSION/json" \
              | jq -e --arg name "$(jq -r .name server.json)" \
                  '.info.description | contains("mcp-name: " + $name)' > /dev/null; then
            exit 0
          fi
          sleep 20
        done
        echo "::error::PyPI does not serve $VERSION with the mcp-name marker yet"
        exit 1

    - name: Install mcp-publisher
      # Checksum from registry_1.8.1_checksums.txt on the same release page.
      # To bump: change the version in the URL and paste the matching line
      # from the new release's checksums file.
      run: |
        curl -fsSLo mcp-publisher.tar.gz \
          "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
        echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
        tar xzf mcp-publisher.tar.gz mcp-publisher

    - name: Publish to the MCP Registry
      run: |
        ./mcp-publisher login github-oidc
        ./mcp-publisher publish
